name: PR90 finalize reviewed patch

on:
  push:
    branches:
      - agent/fix-rag-memory-e2e-root-causes
    paths:
      - .github/workflows/pr90-finalize-reviewed-patch.yml

permissions:
  contents: write

concurrency:
  group: pr90-finalize-reviewed-patch
  cancel-in-progress: false

jobs:
  apply-reviewed-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out temporary PR head
        uses: actions/checkout@v4
        with:
          ref: agent/fix-rag-memory-e2e-root-causes
          fetch-depth: 0

      - name: Apply and push reviewed patch
        shell: bash
        env:
          ORIGINAL_HEAD: 19f598eb244d1d0794906fc9a98bb1909dbbc4ad
          TEMP_HEAD: ${{ github.sha }}
          PATCH_URL: https://hatchable.com/s/eyJwIjozOTI1LCJrIjoicHI5MC1maW5hbGl6ZVwvcHI5MC1yZXZpZXdlZC5wYXRjaCJ9.7c98761da0af175df0d783d3ad0fbb7285e50a986a166e08c1c6cfe337c19b3f
        run: |
          set -euo pipefail
          branch='agent/fix-rag-memory-e2e-root-causes'
          workflow='.github/workflows/pr90-finalize-reviewed-patch.yml'
          files=(
            ios/Lumen/Services/E2ETestRunner.swift
            ios/LumenTests/PersistenceAuditTests.swift
            ios/LumenTests/E2ETestRunnerHygieneTests.swift
          )

          test "$(git rev-parse HEAD)" = "$TEMP_HEAD"
          curl --fail --location --retry 3 --retry-all-errors "$PATCH_URL" -o /tmp/pr90.patch
          echo 'dd18bd48027e0d0c19d0f34eb6ec701c4794c47eaad0b021f78c628700ce7016  /tmp/pr90.patch' | sha256sum --check -

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Preferred path: replace the temporary workflow commits with one reviewed patch commit.
          git reset --hard "$ORIGINAL_HEAD"
          git apply --check /tmp/pr90.patch
          git apply /tmp/pr90.patch
          git diff --check
          git add -- "${files[@]}"
          git diff --cached --check
          git commit -m 'test: finish PR 90 review fixes'

          if git push --force-with-lease="refs/heads/$branch:$TEMP_HEAD" origin "HEAD:refs/heads/$branch"; then
            exit 0
          fi

          # Branch-protection fallback: retain transport history, apply the same verified patch,
          # remove the one-shot workflow, and push a normal fast-forward commit.
          git reset --hard "$TEMP_HEAD"
          git apply --check /tmp/pr90.patch
          git apply /tmp/pr90.patch
          rm -f "$workflow"
          git diff --check
          git add -- "${files[@]}" "$workflow"
          git diff --cached --check
          git commit -m 'test: finish PR 90 review fixes'
          git push origin "HEAD:refs/heads/$branch"
